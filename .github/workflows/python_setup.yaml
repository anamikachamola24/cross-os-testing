name: python_install
on:
        push:
                branches:
                - main
jobs:             
        python_install:
                runs-on : ubuntu-latest
                steps:

                - uses: actions/setup-python@v4
                  with:   
                  python-version: '3.9'
                
                - name: installation
                  run : pip install pytest flake8;      
                - name: python version
                  run: python --version 
                - name: flake chek 
                  run:  flake8 --version
                - name: Pytest check
                  run:  pytest --version
